name = "tuba-openai-proxy"
main = "src/index.js"
compatibility_date = "2024-12-01"

# 每日配额计数器（必配，否则每日限额不生效，脚本仍可运行）
# 创建方式：npx wrangler kv namespace create QUOTA
[[kv_namespaces]]
binding = "QUOTA"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# 原生分钟级限速（可选，免费计划可用；不配则退化为内存限速兜底）
# period 只能是 10 / 60 / 600 / 3600 秒
# [[ratelimits]]
# binding = "RATE_LIMITER"
# namespace_id = "1001"
# fixed_window = { limit = 30, period = 60 }

[vars]
# 每分钟请求数（0 = 不限制）
RATE_LIMIT_PER_MINUTE = "30"
# 每用户每日请求数（0 = 不限制）
DAILY_REQUESTS = "300"
# 每用户每日 token 数（0 = 不限制）
DAILY_TOKENS = "1000000"
# 访问 GET /v1/admin/usage 用的管理员 key（留空则禁用该接口）
ADMIN_KEY = ""

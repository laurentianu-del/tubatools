name: Publish to WinGet

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v1.0.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Resolve release info
        id: release-info
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = '${{ inputs.release_tag }}'.Trim()
          if ($TAG -notmatch '^v') { $TAG = "v$TAG" }
          $VERSION = $TAG -replace '^v',''

          Write-Host "Fetching release for tag: $TAG"
          $RELEASE = gh release view $TAG --repo ${{ github.repository }} --json tagName,isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Release not found: $TAG"
            exit 1
          }
          $ReleaseObj = $RELEASE | ConvertFrom-Json
          if ($ReleaseObj.isDraft) {
            Write-Error "Release $TAG is a draft. Publish the release first."
            exit 1
          }

          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "tag=$TAG" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $VERSION  Tag: $TAG"

      - name: Download installers and compute hashes
        id: hashes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = '${{ steps.release-info.outputs.tag }}'
          $VERSION = '${{ steps.release-info.outputs.version }}'

          $archs = @('x64','x86','arm64')
          $hashMap = @{}

          foreach ($arch in $archs) {
            $pattern = "TubaWinUi3_Setup_${VERSION}_${arch}.exe"
            Write-Host "Downloading $pattern ..."
            gh release download $TAG --repo ${{ github.repository }} --pattern $pattern --dir . 2>$null
            if (Test-Path $pattern) {
              $hash = (Get-FileHash -Path $pattern -Algorithm SHA256).Hash.ToLower()
              $hashMap[$arch] = $hash
              Write-Host "  $arch SHA256: $hash"
            } else {
              Write-Host "  $arch installer not found, skipping"
            }
          }

          if ($hashMap.Count -eq 0) {
            Write-Error "No installers found for $TAG"
            exit 1
          }

          echo "hash_x64=$($hashMap['x64'])" >> $env:GITHUB_OUTPUT
          echo "hash_x86=$($hashMap['x86'])" >> $env:GITHUB_OUTPUT
          echo "hash_arm64=$($hashMap['arm64'])" >> $env:GITHUB_OUTPUT

      - name: Generate winget manifests
        shell: pwsh
        run: |
          $VERSION = '${{ steps.release-info.outputs.version }}'
          $H_X64 = '${{ steps.hashes.outputs.hash_x64 }}'
          $H_X86 = '${{ steps.hashes.outputs.hash_x86 }}'
          $H_ARM64 = '${{ steps.hashes.outputs.hash_arm64 }}'

          New-Item -ItemType Directory -Path winget_manifest -Force | Out-Null

          $base = "https://github.com/luolangaga/tubatool/releases/download/v$VERSION/TubaWinUi3_Setup_${VERSION}"

          function Add-InstallerEntry {
            param([string]$Arch, [string]$Hash, [System.Text.StringBuilder]$Sb, [string]$Url)
            [void]$Sb.AppendLine("  - Architecture: $Arch")
            [void]$Sb.AppendLine("    InstallerUrl: $Url")
            [void]$Sb.AppendLine("    InstallerSha256: $Hash")
            [void]$Sb.AppendLine("    InstallerSwitches:")
            [void]$Sb.AppendLine("      Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-")
            [void]$Sb.AppendLine("      SilentWithProgress: /SILENT /SUPPRESSMSGBOXES /NORESTART /SP-")
            [void]$Sb.AppendLine("      InstallLocation: /DIR=""<INSTALLPATH>""")
            [void]$Sb.AppendLine("    ProductCode: '{DA3D64F4-winui3-Tuba-2025}'")
            [void]$Sb.AppendLine("    Scope: machine")
            [void]$Sb.AppendLine("    AppsAndFeaturesEntries:")
            [void]$Sb.AppendLine("      - DisplayName: 图吧工具箱winui3")
            [void]$Sb.AppendLine("        Publisher: 罗澜嘎嘎")
            [void]$Sb.AppendLine("        DisplayVersion: $VERSION")
            [void]$Sb.AppendLine("        ProductCode: '{DA3D64F4-winui3-Tuba-2025}'")
          }

          # --- installer.yaml ---
          $sb = [System.Text.StringBuilder]::new()
          [void]$sb.AppendLine("PackageIdentifier: luolangaga.tubatools")
          [void]$sb.AppendLine("PackageVersion: $VERSION")
          [void]$sb.AppendLine("InstallerType: inno")
          [void]$sb.AppendLine("Installers:")
          if ($H_X64)  { Add-InstallerEntry -Arch x64   -Hash $H_X64   -Url "${base}_x64.exe"   -Sb $sb }
          if ($H_X86)  { Add-InstallerEntry -Arch x86   -Hash $H_X86   -Url "${base}_x86.exe"   -Sb $sb }
          if ($H_ARM64){ Add-InstallerEntry -Arch arm64 -Hash $H_ARM64 -Url "${base}_arm64.exe" -Sb $sb }
          [void]$sb.AppendLine("ManifestType: installer")
          [void]$sb.AppendLine("ManifestVersion: 1.6.0")
          $sb.ToString() | Set-Content -Path 'winget_manifest\luolangaga.tubatools.installer.yaml' -Encoding UTF8

          # --- locale zh-CN ---
          @(
            "PackageIdentifier: luolangaga.tubatools"
            "PackageVersion: $VERSION"
            "PackageName: 图吧工具箱WinUI3"
            "PackageLocale: zh-CN"
            "Publisher: 罗澜嘎嘎"
            "PublisherUrl: https://github.com/luolangaga/tubatool"
            "PublisherSupportUrl: https://github.com/luolangaga/tubatool/issues"
            "Author: 罗澜嘎嘎"
            "PackageUrl: https://github.com/luolangaga/tubatool"
            "License: MIT"
            "LicenseUrl: https://github.com/luolangaga/tubatool/blob/master/LICENSE"
            "Copyright: Copyright (C) 2025 罗澜嘎嘎"
            "ShortDescription: PC hardware toolbox for diagnostics and stress testing"
            "Description: 图吧工具箱WinUI3是一款基于WinUI 3开发的PC硬件工具箱，提供硬件信息查看、实时监控、系统优化、内置工具等丰富功能。"
            "Tags:"
            "  - hardware"
            "  - diagnostic"
            "  - stress-test"
            "  - system-info"
            "  - benchmark"
            "  - chinese"
            "Moniker: tubawinui3"
            "ReleaseNotesUrl: https://github.com/luolangaga/tubatool/releases/tag/v$VERSION"
            "ManifestType: defaultLocale"
            "ManifestVersion: 1.6.0"
          ) -join "`n" | Set-Content -Path 'winget_manifest\luolangaga.tubatools.locale.zh-CN.yaml' -Encoding UTF8

          # --- version.yaml ---
          @(
            "PackageIdentifier: luolangaga.tubatools"
            "PackageVersion: $VERSION"
            "DefaultLocale: zh-CN"
            "ManifestType: version"
            "ManifestVersion: 1.6.0"
          ) -join "`n" | Set-Content -Path 'winget_manifest\luolangaga.tubatools.yaml' -Encoding UTF8

          Write-Host "Manifests generated:"
          Get-ChildItem winget_manifest | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Install wingetcreate
        shell: pwsh
        run: |
          winget install Microsoft.WingetCreate --accept-source-agreements --accept-package-agreements --disable-interactivity 2>$null || true

      - name: Validate manifests
        shell: pwsh
        run: |
          $manifestDir = (Resolve-Path winget_manifest).Path
          $allYamls = (Get-ChildItem $manifestDir -Filter '*.yaml' | ForEach-Object { $_.FullName }) -join ','
          winget validate --manifest $manifestDir 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::winget validation reported issues (non-blocking)"
          } else {
            Write-Host "Manifest validation passed"
          }

      - name: Submit to WinGet
        id: submit
        shell: pwsh
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          $VERSION = '${{ steps.release-info.outputs.version }}'

          if (-not $env:WINGET_GITHUB_TOKEN) {
            Write-Host "WINGET_GITHUB_TOKEN not set - skipping automatic submission."
            Write-Host ""
            Write-Host "To submit manually:"
            Write-Host "  1. Fork https://github.com/microsoft/winget-pkgs"
            Write-Host "  2. Copy winget_manifest/*.yaml to manifests/l/luolangaga/tubatools/$VERSION/"
            Write-Host "  3. Submit a PR to winget-pkgs"
            echo "submitted=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          wingetcreate update luolangaga.tubatools `
            --version $VERSION `
            --submit `
            --token $env:WINGET_GITHUB_TOKEN

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Submitted to WinGet successfully"
            echo "submitted=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::warning::wingetcreate update failed - package may not exist yet. Try 'wingetcreate new' for first submission."
            echo "submitted=false" >> $env:GITHUB_OUTPUT
          }

      - name: Upload manifests
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ steps.release-info.outputs.version }}
          path: winget_manifest/

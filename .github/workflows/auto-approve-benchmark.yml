name: Update leaderboard

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild leaderboard files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const reportsDir = path.join(process.env.GITHUB_WORKSPACE, 'reports');
            if (!fs.existsSync(reportsDir)) {
              core.info('No reports directory found');
              return;
            }

            const reports = [];

            function walkDir(dir) {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  walkDir(fullPath);
                } else if (entry.isFile() && entry.name.endsWith('.json')) {
                  try {
                    const content = fs.readFileSync(fullPath, 'utf8');
                    const data = JSON.parse(content);
                    if (data.id && data.author && data.cpuName && data.gpuName) {
                      data.repoPath = path.relative(process.env.GITHUB_WORKSPACE, fullPath).replace(/\\/g, '/');
                      reports.push(data);
                    }
                  } catch (e) {
                    core.warning(`Failed to parse ${fullPath}: ${e.message}`);
                  }
                }
              }
            }

            walkDir(reportsDir);

            function computeRanking(reports, sortKey) {
              return [...reports]
                .sort((a, b) => (b[sortKey] || 0) - (a[sortKey] || 0))
                .map((r, i) => ({
                  rank: i + 1,
                  id: r.id,
                  author: r.author,
                  cpuName: r.cpuName,
                  gpuName: r.gpuName,
                  gamingScore: r.gamingScore || 0,
                  officeScore: r.officeScore || 0,
                  cpuSingleCoreScore: r.cpuSingleCoreScore || 0,
                  cpuMultiCoreScore: r.cpuMultiCoreScore || 0,
                  gpuRenderScore: r.gpuRenderScore || 0,
                  memoryCapacityScore: r.memoryCapacityScore || 0,
                  diskSeqReadScore: r.diskSeqReadScore || 0,
                  diskSeqWriteScore: r.diskSeqWriteScore || 0,
                  disk4KReadScore: r.disk4KReadScore || 0,
                  disk4KWriteScore: r.disk4KWriteScore || 0,
                  browserTotalScore: r.browserTotalScore || 0,
                  gamingGrade: r.gamingGrade || '',
                  officeGrade: r.officeGrade || '',
                  submittedAt: r.submittedAt || '',
                  osName: r.osName || '',
                  motherboardName: r.motherboardName || '',
                  memoryInfo: r.memoryInfo || '',
                  diskInfo: r.diskInfo || '',
                  displayInfo: r.displayInfo || '',
                  repoPath: r.repoPath || ''
                }));
            }

            const sortKeys = {
              gaming: 'gamingScore',
              office: 'officeScore',
              cpu: 'cpuMultiCoreScore',
              gpu: 'gpuRenderScore',
              disk: 'diskSeqReadScore',
              browser: 'browserTotalScore'
            };

            const leaderboards = {};
            const pagedResults = {};
            const PAGE_SIZE = 300;

            for (const [key, sortKey] of Object.entries(sortKeys)) {
              const ranked = computeRanking(reports, sortKey);
              leaderboards[key] = ranked;

              const totalPages = Math.ceil(ranked.length / PAGE_SIZE);
              const pages = [];
              for (let page = 0; page < totalPages; page++) {
                const start = page * PAGE_SIZE;
                const end = Math.min(start + PAGE_SIZE, ranked.length);
                pages.push({
                  sortBy: key,
                  page: page,
                  pageSize: PAGE_SIZE,
                  totalEntries: ranked.length,
                  totalPages: totalPages,
                  entries: ranked.slice(start, end)
                });
              }
              pagedResults[key] = pages;
            }

            // Generate original leaderboard.json (backward compatible)
            const result = {
              updatedAt: new Date().toISOString(),
              totalReports: reports.length,
              leaderboards: leaderboards
            };
            fs.writeFileSync('leaderboard.json', JSON.stringify(result, null, 2));
            core.info(`Leaderboard rebuilt with ${reports.length} reports`);

            // Generate paged leaderboard files per dimension in folders
            for (const [key, pages] of Object.entries(pagedResults)) {
              const folder = path.join('leaderboard', key);
              if (!fs.existsSync(folder)) {
                fs.mkdirSync(folder, { recursive: true });
              }
              for (const pageData of pages) {
                const filename = pageData.page === 0
                  ? `${key}.json`
                  : `${key}_${pageData.page}.json`;
                const filePath = path.join(folder, filename);
                fs.writeFileSync(filePath, JSON.stringify(pageData, null, 2));
                core.info(`Written ${filePath} (page ${pageData.page}, ${pageData.entries.length} entries)`);
              }
            }

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json leaderboard/
          git diff --cached --quiet || git commit -m "chore: update leaderboard [skip ci]"
          git push

name: Sync Release to GitCode

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.3, untagged-xxx for drafts)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release on GitCode'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  sync-to-gitcode:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release
        id: release-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          echo "Looking up release for tag: $INPUT_TAG"

          RELEASE_ID=""

          RESPONSE=$(gh api "repos/${{ github.repository }}/releases/tags/$INPUT_TAG" 2>/dev/null || true)
          if [ -n "$RESPONSE" ] && echo "$RESPONSE" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
            RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
            echo "Found by tag API, id=$RELEASE_ID"
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "Tag API failed, listing all releases (including drafts)..."
            ALL_RELEASES=$(gh api "repos/${{ github.repository }}/releases?per_page=100" 2>/dev/null || echo "[]")
            RELEASE_ID=$(echo "$ALL_RELEASES" | python3 -c "
          import sys, json
          tag = '$INPUT_TAG'
          for r in json.load(sys.stdin):
            if r.get('tag_name') == tag:
              print(r['id'])
              break
          " 2>/dev/null || echo "")
            if [ -n "$RELEASE_ID" ]; then
              echo "Found in release list, id=$RELEASE_ID"
            fi
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Could not find release for '$INPUT_TAG'"
            exit 1
          fi

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

          RELEASE_JSON=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")
          TAG=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name',''))")
          IS_DRAFT=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('draft',False))")
          IS_PRERELEASE=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('prerelease',False))")

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.prerelease }}" = "true" ] || [ "$IS_PRERELEASE" = "True" ]; then
            echo "release_status=pre" >> "$GITHUB_OUTPUT"
          else
            echo "release_status=latest" >> "$GITHUB_OUTPUT"
          fi

          echo "Release: tag=$TAG, id=$RELEASE_ID, draft=$IS_DRAFT, prerelease=$IS_PRERELEASE"

      - name: Download release assets via API
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="${{ steps.release-info.outputs.release_id }}"
          mkdir -p release_files

          ASSETS=$(gh api repos/${{ github.repository }}/releases/"$RELEASE_ID"/assets --paginate)
          echo "$ASSETS" | python3 -c "
          import sys, json, subprocess
          assets = json.load(sys.stdin)
          for a in assets:
            name = a['name']
            url = a['url']
            print(f'Downloading {name} ...')
            subprocess.run([
              'curl', '-sL', '-o', f'release_files/{name}',
              '-H', 'Accept: application/octet-stream',
              '-H', f'Authorization: token $GH_TOKEN',
              url
            ], check=True)
          "

          ASSET_COUNT=$(find release_files -type f | wc -l)
          echo "Downloaded $ASSET_COUNT assets"
          echo "asset_count=$ASSET_COUNT" >> "$GITHUB_OUTPUT"

      - name: Calculate file hashes
        id: hashes
        run: |
          cd release_files
          echo "## SHA256 哈希值" > ../hash_table.md
          echo "" >> ../hash_table.md
          echo "| 文件 | SHA256 |" >> ../hash_table.md
          echo "|------|--------|" >> ../hash_table.md
          for f in *.exe *.zip; do
            [ -f "$f" ] || continue
            HASH=$(sha256sum "$f" | awk '{print $1}')
            echo "| \`$f\` | \`$HASH\` |" >> ../hash_table.md
          done
          cat ../hash_table.md

      - name: Create GitCode Release
        id: gitcode-create
        env:
          GITCODE_ACCESS_TOKEN: ${{ secrets.GITCODE_ACCESS_TOKEN }}
        run: |
          TAG="${{ steps.release-info.outputs.tag }}"
          RELEASE_STATUS="${{ steps.release-info.outputs.release_status }}"
          OWNER="luolangaga"
          REPO="tubatool"
          API_BASE="https://api.atomgit.com/api/v5/repos/$OWNER/$REPO"

          echo "Creating GitCode release for tag $TAG (status=$RELEASE_STATUS) ..."

          BODY=$(cat hash_table.md | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")

          CREATE_RESPONSE=$(curl -s -X POST "$API_BASE/releases?access_token=$GITCODE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"$TAG\",
              \"name\": \"图吧工具箱WinUI3 $TAG\",
              \"body\": $BODY,
              \"target_commitish\": \"master\",
              \"release_status\": \"$RELEASE_STATUS\"
            }")

          echo "Create response: $CREATE_RESPONSE"

          RESP_TAG=$(echo "$CREATE_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo "")

          if [ "$RESP_TAG" != "$TAG" ]; then
            echo "::error::Failed to create GitCode release (expected tag=$TAG, got tag=$RESP_TAG)"
            exit 1
          fi

          echo "GitCode release created for tag $TAG"

      - name: Upload assets to GitCode
        env:
          GITCODE_ACCESS_TOKEN: ${{ secrets.GITCODE_ACCESS_TOKEN }}
        run: |
          TAG="${{ steps.release-info.outputs.tag }}"
          OWNER="luolangaga"
          REPO="tubatool"
          API_BASE="https://api.atomgit.com/api/v5/repos/$OWNER/$REPO"

          for f in release_files/*.exe release_files/*.zip; do
            [ -f "$f" ] || continue
            FNAME=$(basename "$f")
            echo "Uploading $FNAME ..."

            UPLOAD_INFO=$(curl -s "$API_BASE/releases/$TAG/upload_url?access_token=$GITCODE_ACCESS_TOKEN&file_name=$FNAME")
            UPLOAD_URL=$(echo "$UPLOAD_INFO" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('url',''))")

            if [ -z "$UPLOAD_URL" ]; then
              echo "::warning::Failed to get upload URL for $FNAME, response: $UPLOAD_INFO"
              continue
            fi

            HEADER_ARGS=$(echo "$UPLOAD_INFO" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          headers = d.get('headers', {})
          args = []
          for k, v in headers.items():
            args.extend(['-H', k + ': ' + v])
          print(' '.join(args))
          ")

            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -X PUT \
              $HEADER_ARGS \
              --data-binary "@$f" \
              "$UPLOAD_URL")

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "  OK ($HTTP_CODE)"
            else
              echo "::warning::Upload $FNAME failed (HTTP $HTTP_CODE)"
            fi
          done

          echo "GitCode release upload complete"
